name: quan_ly_chi_tieu
description: Ứng dụng quản lý chi tiêu cá nhân - Offline. Tác giả Hao Nguyen.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1
  intl: ^0.18.1
  provider: ^6.1.1
  flutter_slidable: ^3.0.1
  fl_chart: ^0.65.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  url_launcher: ^6.2.1
  excel: ^4.0.3
  open_file: ^3.5.7
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  local_auth: ^2.3.0
  file_picker: ^8.0.0
  share_plus: ^12.0.2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
